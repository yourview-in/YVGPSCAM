name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup debug.keystore & Print SHA-1
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > debug.keystore
            echo "Loaded permanent keystore from GitHub Secrets."
          elif [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "=== BASE64 KEYSTORE ==="
            base64 -w 0 debug.keystore
            echo ""
          fi
          echo "=== SHA-1 FINGERPRINT ==="
          keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android | grep "SHA1:"

      - name: Inject API keys & generate matching google-services.json
        env:
          WEB_CLIENT_ID: ${{ secrets.WEB_CLIENT_ID }}
          GOOGLE_DRIVE_API_KEY: ${{ secrets.GOOGLE_DRIVE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          CLIENT_ID="${WEB_CLIENT_ID}"
          if [ -z "$CLIENT_ID" ]; then CLIENT_ID="://googleusercontent.com"; fi
          PROJECT_NUM=$(echo "$CLIENT_ID" | cut -d'-' -f1)

          DRIVE_KEY="${GOOGLE_DRIVE_API_KEY:-placeholder}"
          GEMINI_KEY="${GEMINI_API_KEY:-placeholder}"
          MAPS_KEY="${MAPS_API_KEY:-placeholder}"

          printf "GOOGLE_DRIVE_API_KEY=%s\n" "$DRIVE_KEY" >> local.properties
          printf "GEMINI_API_KEY=%s\n" "$GEMINI_KEY" >> local.properties
          printf "MAPS_API_KEY=%s\n" "$MAPS_KEY" >> local.properties

          printf "GOOGLE_DRIVE_API_KEY=%s\n" "$DRIVE_KEY" > secrets.properties
          printf "GEMINI_API_KEY=%s\n" "$GEMINI_KEY" >> secrets.properties
          printf "MAPS_API_KEY=%s\n" "$MAPS_KEY" >> secrets.properties

          cat << EOF > app/google-services.json
          {
            "project_info": {
              "project_number": "$PROJECT_NUM",
              "project_id": "yvgpscam-$PROJECT_NUM"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:$PROJECT_NUM:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.aistudio.yvgpscam.k7m4xp"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "$CLIENT_ID",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "$DRIVE_KEY"
                  }
                ]
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Auto-increment App Version
        run: |
          BUILD_NUM=${{ github.run_number }}
          VERSION_NAME="1.0.${BUILD_NUM}"
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV
          if [ -f app/build.gradle.kts ]; then
            sed -i -E "s/versionCode\s*=\s*[0-9]+/versionCode = ${BUILD_NUM}/g" app/build.gradle.kts
            sed -i -E "s/versionName\s*=\s*\"[^\"]+\"/versionName = \"${VERSION_NAME}\"/g" app/build.gradle.kts
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle assembleDebug -Djava.awt.headless=true

      - name: Rename APK with Version
        run: |
          APK_FILE=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          mkdir -p release-apk
          cp "$APK_FILE" "release-apk/YVGPSCAM-v${VERSION_NAME}.apk"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YVGPSCAM-v${{ env.VERSION_NAME }}
          path: release-apk/*.apk

      - name: Publish Direct APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: YVGPSCAM v${{ env.VERSION_NAME }}
          body: "Automated APK build from Google AI Studio push (Commit: ${{ github.sha }})."
          files: release-apk/*.apk
