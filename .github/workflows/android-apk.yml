name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate missing debug.keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Inject API keys & default_web_client_id
        env:
          DRIVE_API_KEY: ${{ secrets.DRIVE_API_KEY }}
          WEB_CLIENT_ID: ${{ secrets.WEB_CLIENT_ID }}
        run: |
          echo "GOOGLE_DRIVE_API_KEY=$DRIVE_API_KEY" >> local.properties
          echo "DRIVE_API_KEY=$DRIVE_API_KEY" >> .env
          mkdir -p app/src/main/res/values
          cat << EOF > app/src/main/res/values/ci_secrets.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="default_web_client_id" translatable="false">${WEB_CLIENT_ID:://googleusercontent.com}</string>
              <string name="google_drive_api_key" translatable="false">${DRIVE_API_KEY:-placeholder}</string>
          </resources>
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle assembleDebug -Djava.awt.headless=true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
